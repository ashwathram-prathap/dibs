name: Firefox regression check
on:
  workflow_dispatch:
    inputs:
      round7_only:
        description: Run only the targeted clock and Day Certificate checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx tsx scripts/build-catalog-assets.ts && npx vite build --mode security-test
      - run: npx playwright test -c playwright.r11.config.ts --project='firefox-*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-regression
          path: |
            review/round11/browser-results.json
            review/round9/devices/firefox-*/
            review/round9/headers/firefox-*/
            review/round11/devices/firefox-*/
          retention-days: 14
