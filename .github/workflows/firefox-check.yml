name: Firefox regression check
on:
  workflow_dispatch:
    inputs:
      round7_only:
        description: Run only the targeted clock and Day Certificate checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - if: ${{ !inputs.round7_only }}
        run: npm run test:e2e -- --project='firefox-*'
      - run: npx playwright test -c playwright.r7.config.ts --project='r7-firefox-*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-regression
          path: |
            review/round7/browser-results.json
            review/round8/certificates/r7-firefox-*
            review/devices/results.json
            review/devices/firefox-*/
          retention-days: 14
