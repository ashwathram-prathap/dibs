name: Firefox regression check
on:
  workflow_dispatch:
    inputs:
      round7_only:
        description: Run only the targeted clock and Day Certificate checks
        type: boolean
        default: false
      r14_ui_only:
        description: Verify R14 UI plus prior UI regression checks
        type: boolean
        default: false
      r13_ui_only:
        description: Verify only R13 UI and audio (fixtures do not need catalog generation)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Provide an audio device for real Web Audio playback
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dibs_ci
          pactl set-default-sink dibs_ci
      - name: Build complete indexes for the full regression suite
        if: ${{ !inputs.r13_ui_only && !inputs.r14_ui_only }}
        run: npx tsx scripts/build-catalog-assets.ts
      - run: npx vite build --mode security-test
      - name: Run Firefox checks
        env:
          R13_UI_ONLY: ${{ inputs.r13_ui_only }}
          R14_UI_ONLY: ${{ inputs.r14_ui_only }}
        run: |
          if [ "$R14_UI_ONLY" = "true" ]; then
            npx playwright test -c playwright.r14.config.ts --project='firefox-*'
          elif [ "$R13_UI_ONLY" = "true" ]; then
            npx playwright test -c playwright.r13.config.ts round13.spec.ts --project='firefox-*'
          else
            npx playwright test -c playwright.r13.config.ts --project='firefox-*'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-regression
          path: |
            review/round13/browser-results.json
            review/round14/browser-results.json
            test-results/
            review/round9/devices/firefox-*/
            review/round9/headers/firefox-*/
            review/round11/devices/firefox-*/
          retention-days: 14
