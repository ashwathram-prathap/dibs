name: R18 Firefox and browser regression
on: workflow_dispatch
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dibs_ci
          pactl set-default-sink dibs_ci
      - run: npx tsx scripts/build-catalog-assets.ts && npx tsx scripts/build-scores.ts && npx vite build --mode security-test
      - run: R18_FIREFOX=1 npx playwright test -c playwright.r18.config.ts
      - run: R18_FULL=1 R18_FIREFOX=1 R18_REPORT=review/round18/firefox-regression-results.json npx playwright test -c playwright.r18.config.ts --project='firefox-390-*' --project='firefox-1440-*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r18-firefox
          path: |
            review/round18/*results.json
            .tmp/r18/browser-artifacts/
          retention-days: 14
